<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Vocacional Monseñor Sanabria</title>
    <link rel="icon" type="image/png" href="src/logo/VOCA%20Admisiones.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, h5, h6, .font-outfit { font-family: 'Outfit', sans-serif; }
        .bg-voca-blue { background-color: #003366; }
        .text-voca-blue { color: #003366; }
        .bg-voca-red { background-color: #cc0000; }
        .hover-bg-voca-red:hover { background-color: #a30000; }
        .text-voca-red { color: #cc0000; }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex items-center justify-center p-4 relative bg-[url('src/img/hero_background.jpg')] bg-cover bg-center bg-fixed">
    
    <!-- Dark overlay for better contrast -->
    <div class="absolute inset-0 bg-black/30 backdrop-blur-[2px]"></div>

    <!-- Liquid Glass Card -->
    <div class="max-w-4xl w-full rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row relative z-10 border border-white/20 bg-white/20 backdrop-blur-[20px]">
        
        <!-- Left Side: Image/Branding -->
        <div class="md:w-1/2 p-8 text-white flex flex-col justify-between relative overflow-hidden bg-[#003366]/70">
            <!-- Background Decoration -->
            <div class="absolute -top-24 -right-24 w-64 h-64 bg-white opacity-10 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-24 -left-24 w-64 h-64 bg-white opacity-10 rounded-full blur-3xl"></div>

            <div class="relative z-10">
                <a href="index.html" class="inline-flex items-center gap-3 text-white hover:text-gray-200 transition">
                    <i class="fa-solid fa-arrow-left"></i> Volver al inicio
                </a>
            </div>
            
            <div class="relative z-10 my-12 text-center">
                <img src="src/logo/VOCA%20Admisiones.png" alt="Logo VOCA" class="w-32 h-32 mx-auto mb-6 drop-shadow-2xl">
                <h1 class="text-4xl font-bold font-outfit mb-4 leading-tight">Bienvenido de nuevo</h1>
                <p class="text-blue-100 text-lg">Accede a la plataforma para gestionar tu proceso de admisión o administrar la institución.</p>
            </div>
            
            <div class="relative z-10 text-sm text-blue-200 text-center">
                &copy; 2026 Vocacional Monseñor Sanabria
            </div>
        </div>

        <!-- Right Side: Login Form -->
        <div class="md:w-1/2 p-8 md:p-12 relative bg-white/[0.85]">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Iniciar Sesión</h2>

            <!-- Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-5">
                    <label class="block text-sm font-semibold text-gray-700 mb-2" id="lbl-username">Identificación o Correo</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-user text-gray-400"></i>
                        </div>
                        <input type="text" id="username" class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-opacity-50" placeholder="estudiante@gmail.com o usuario admin" required>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Contraseña</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-gray-400"></i>
                        </div>
                        <input type="password" id="password" class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-opacity-50" placeholder="••••••••" required>
                    </div>
                    <div class="text-right mt-2">
                        <a href="#" class="text-sm text-voca-blue hover:text-blue-800 hover:underline font-medium">¿Olvidaste tu contraseña?</a>
                    </div>
                </div>

                <button type="submit" class="w-full bg-voca-red hover-bg-voca-red text-white font-bold py-3 px-4 rounded-lg shadow-md transition flex justify-center items-center gap-2">
                    Ingresar <i class="fa-solid fa-right-to-bracket"></i>
                </button>

                <p class="text-center text-gray-500 text-sm mt-8" id="register-prompt">
                    ¿No has iniciado tu proceso? <br> <a href="index.html#registro" class="text-voca-red font-semibold hover:underline">Regístrate en el Paso 1</a>
                </p>
            </form>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;

            // Consulta a Supabase para verificar si es admin (en la nueva tabla)
            try {
                const { data: adminData, error: adminError } = await supabaseClient
                    .from('administradores')
                    .select('*')
                    .eq('correo', user.toLowerCase())
                    .eq('password', pass)
                    .single();

                if (adminData && !adminError) {
                    localStorage.setItem('adminName', adminData.nombre);
                    window.location.href = 'dashboard-admin.html';
                    return;
                }
            } catch (e) {
                // Falla silenciosamente si la tabla 'administradores' aún no existe
            }

            // Validar admin sincrónicamente (fallback o admin por defecto)
            if (user === 'admin' && pass === 'admin2026') {
                localStorage.setItem('adminName', 'Admin Principal');
                window.location.href = 'dashboard-admin.html';
                return;
            }

            // Validaciones locales rápidas antes de cargar
            if (!user.toLowerCase().endsWith('@gmail.com') || pass.length < 8) {
                Swal.fire({
                    icon: 'error',
                    title: 'Credenciales inválidas',
                    text: 'Verifique su correo/usuario y contraseña. Recuerde que los estudiantes usan correo @gmail.com y contraseñas de al menos 8 caracteres.',
                    confirmButtonColor: '#cc0000'
                });
                return;
            }

            // Mostrar el loader solo si vamos a hacer una consulta a la base de datos
            Swal.fire({
                title: 'Autenticando...',
                allowEscapeKey: false,
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            // Consulta a Supabase
            const { data, error } = await supabaseClient
                .from('aspirantes')
                .select('*')
                .eq('email', user.toLowerCase())
                .eq('password', pass)
                .single();

            if (error || !data) {
                Swal.fire({
                    icon: 'error',
                    title: 'Credenciales inválidas',
                    text: 'El correo o la contraseña no coinciden o no estás registrado.',
                    confirmButtonColor: '#cc0000'
                });
            } else if (data.estado !== 'Verificado') {
                Swal.fire({
                    icon: 'warning',
                    title: 'Cuenta no verificada',
                    text: 'Debes activar tu cuenta con el PIN que se generó al registrarte.',
                    confirmButtonColor: '#ffcc00'
                });
            } else if (data.cambio_clave_requerido) {
                const { value: newPassword } = await Swal.fire({
                    title: 'Cambio de Clave Obligatorio',
                    html: `
                        <p class="text-sm text-gray-600 mb-4" style="margin-bottom: 1rem;">Estás ingresando con una clave temporal. Por seguridad, debes crear una nueva contraseña ahora mismo.</p>
                        <input type="password" id="swal-pass1" class="swal2-input" placeholder="Nueva Contraseña" style="width: 80%; margin-bottom: 10px;">
                        <input type="password" id="swal-pass2" class="swal2-input" placeholder="Confirmar Contraseña" style="width: 80%;">
                    `,
                    focusConfirm: false,
                    confirmButtonText: 'Actualizar Contraseña',
                    confirmButtonColor: '#003366',
                    allowOutsideClick: false,
                    showCancelButton: true,
                    cancelButtonText: 'Cancelar',
                    preConfirm: () => {
                        const p1 = document.getElementById('swal-pass1').value;
                        const p2 = document.getElementById('swal-pass2').value;
                        
                        if (!p1 || p1.length < 8) {
                            Swal.showValidationMessage('La contraseña debe tener al menos 8 caracteres');
                            return false;
                        }
                        if (p1 !== p2) {
                            Swal.showValidationMessage('Las contraseñas no coinciden');
                            return false;
                        }
                        return p1;
                    }
                });

                if (newPassword) {
                    Swal.fire({ title: 'Actualizando...', didOpen: () => Swal.showLoading() });
                    
                    const { error: updateError } = await supabaseClient
                        .from('aspirantes')
                        .update({ password: newPassword, cambio_clave_requerido: false })
                        .eq('id', data.id);
                        
                    if (updateError) {
                        Swal.fire('Error', 'Hubo un problema al guardar la nueva contraseña.', 'error');
                    } else {
                        await Swal.fire('¡Contraseña Actualizada!', 'Tu nueva contraseña ha sido guardada con éxito.', 'success');
                        
                        // Guardar datos en localStorage y redirigir
                        localStorage.setItem('studentName', data.nombre);
                        localStorage.setItem('studentLastName', data.apellido);
                        localStorage.setItem('studentEmail', data.email);
                        localStorage.setItem('studentId', data.identificacion);
                        localStorage.setItem('studentPhone', data.telefono || '');
                        
                        if (!data.registro_completado || !data.centro_procedencia) {
                            window.location.href = 'completar-registro.html';
                        } else {
                            window.location.href = 'dashboard-estudiante.html';
                        }
                    }
                }
            } else {
                // Guardar datos en localStorage para mostrarlos en el dashboard
                localStorage.setItem('studentName', data.nombre);
                localStorage.setItem('studentLastName', data.apellido);
                localStorage.setItem('studentEmail', data.email);
                localStorage.setItem('studentId', data.identificacion);
                localStorage.setItem('studentPhone', data.telefono || '');
                
                if (!data.registro_completado || !data.centro_procedencia) {
                    window.location.href = 'completar-registro.html';
                } else {
                    window.location.href = 'dashboard-estudiante.html';
                }
            }
        }
    </script>
</body>
</html>
